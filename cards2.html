<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards 2 Selection Tree</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-image: url(images/pack_2_open.png);
      background-size: fill;
      background-repeat: no-repeat;
      background-position: center;
    }



    /* HEADER BAR */
    .header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 80px;

      background: #707070;
      background: linear-gradient(180deg, rgba(112, 112, 112, 0.75) 0%, rgba(112, 112, 112, 0.5) 30%, rgba(255, 255, 255, 0) 100%);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      z-index: 1000;


      backdrop-filter: blur(8px);

      opacity: 0%;
      animation-name: headerAnimation;
      animation-duration: 3s;
      animation-delay: none;
      animation-fill-mode: forwards;
    }

    @keyframes headerAnimation {
      0% {
        opacity: 0%;
      }

      10% {
        opacity: 0%;
      }

      20% {
        opacity: 0%;
      }

      30% {
        opacity: 0%;
      }

      35% {
        opacity: 5%;
      }

      40% {
        opacity: 15%;
      }

      50% {
        opacity: 30%;
      }

      55% {
        opacity: 40%;
      }

      60% {
        opacity: 50%;
      }

      65% {
        opacity: 60%;
      }

      70% {
        opacity: 70%;
      }

      80% {
        opacity: 80%;
      }

      90% {
        opacity: 90%;
      }

      100% {
        opacity: 100%;
      }
    }


    /* BUTTONS */
    .header-btn {
      width: 48px;
      height: 48px;

      border: none;
      background: transparent;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .header-btn:hover {
      transform: scale(1.1);
    }

    .header-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    .header-btn-pack {
      width: 48px;
      height: 48px;

      margin: none;

      border: none;
      background: transparent;

      cursor: pointer;

      transition: scale(1.1);

    }

    .header-btn-pack:hover {
      transform: scale(1.2);
    }

    .header-btn-pack img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    .cards-container {
      position: relative;
      width: 900px;
      height: 500px;
      perspective: 1200px;
    }


    .cards-container {
      position: relative;
      width: 900px;
      height: 500px;
      perspective: 1200px;
    }

    .card {
      position: absolute;
      width: 228px;
      height: 380px;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
      transition:
        transform 1s ease,
        left 1.2s ease,
        box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-front {
      transform: rotateY(180deg);
    }

    /* Initial Stack */
    .card:nth-child(1) {
      z-index: 3;
    }

    .card:nth-child(2) {
      z-index: 2;
    }

    .card:nth-child(3) {
      z-index: 1;
    }

    /* Spread Animation */
    .spread.card-1 {
      left: calc(50% - 260px);
      transform: translate(-50%, -50%) rotate(-12deg);
    }

    .spread.card-2 {
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .spread.card-3 {
      left: calc(50% + 260px);
      transform: translate(-50%, -50%) rotate(12deg);
    }

    /* Flip State */
    .flipped {
      transform-style: preserve-3d;
    }

    .flipped.card-1 {
      transform: translate(-50%, -50%) rotateY(180deg) rotate(-12deg);
    }

    .flipped.card-2 {
      transform: translate(-50%, -50%) rotateY(180deg);
    }

    .flipped.card-3 {
      transform: translate(-50%, -50%) rotateY(180deg) rotate(12deg);
    }




    .flipped.card-1:hover {
      transform: translate(-50%, -50%) rotateY(180deg) rotate(-12deg) scale(1.05);
    }

    .flipped.card-2:hover {
      transform: translate(-50%, -50%) rotateY(180deg) scale(1.05);
    }

    .flipped.card-3:hover {
      transform: translate(-50%, -50%) rotateY(180deg) rotate(12deg) scale(1.05);
    }





    /*DESKTOP CSS FROM HERE ON*/
    /* =========================*/
    @media (min-width: 1410px) {


      .h2-right {
        margin-right: 40%;
      }

      .h2-left {
        margin-left: 40%;
      }



      .header-btn-pack-menu {
        display: none;
      }


      .header-mobile-menutop {

        align-items: center;
        justify-content: space-between;


        padding: 0 10px;
        margin-top: 0vh;

        z-index: 3;

        opacity: 90%;
        /*
    backdrop-filter: blur(8px);
*/
      }



      .header-mobile {
        position: flex;
        top: 0%;
        left: 0%;

        width: 100%;
        height: 6vh;
        /*
    background: rgba(255, 255, 255, 0.85);
*/
        display: flex;
        align-items: center;
        justify-content: space-between;


        padding: 0 800px;
        margin-top: 0vh;

        z-index: 3;

        /*
    backdrop-filter: blur(8px);
*/
      }


      /* BUTTONS MOBILE menu*/
      .header-btn-mobile {
        width: 60px;
        height: 60px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-mobile:hover {
        transform: scale(1.1);
      }

      .header-btn-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-2-mobile {
        width: 60px;
        height: 60px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-2-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-3-mobile {
        width: 60px;
        height: 60px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-3-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-4-mobile {
        width: 60px;
        height: 60px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-4-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }


    }








    /* =========================
   MOBILE LAYOUT
   ========================= */
    @media (max-width: 768px) {

      body {
        background-image: url(images/pack_1_open.png);
        background-size: contain;
      }

      .cards-container {
        width: 100%;
        height: 100vh;
      }

      .card {
        width: 35vw;
        height: calc(35vw * 1.6667);
        max-width: 180px;
        max-height: 300px;

        left: 50%;
        top: 50%;
        transform-style: preserve-3d;
        transform: translate(-50%, -50%);
        transition:
          transform 1s ease,
          left 1.2s ease,
          box-shadow 0.3s ease;
      }

      /* Vertical spread */
      .spread.card-1 {
        left: 25%;
        top: 48%;
        rotate: 5deg;
        transform: translate(-50%, -50%);
        z-index: -1;
      }

      .spread.card-2 {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .spread.card-3 {
        left: 75%;
        top: 50%;
        rotate: -5deg;
        transform: translate(-50%, -50%);
      }

      /* Flipped positions */
      .flipped.card-1 {
        left: 20%;
        top: 30%;
        transform: translate(-50%, -50%) rotateY(180deg);
      }

      .flipped.card-2 {
        transform: translate(-50%, -50%) rotateY(180deg);
        z-index: 9999;
      }

      .flipped.card-3 {
        left: 75%;
        top: 70%;
        rotate: 5deg;
        transform: translate(-50%, -50%) rotateY(180deg);
      }

      /* Hover effects aren't useful on mobile */
      .flipped.card-1:hover,
      .flipped.card-2:hover,
      .flipped.card-3:hover {
        transform: translate(-50%, -50%) rotateY(180deg);
      }



      .header-btn-pack {
        display: none;
      }


      .header-btn-pack-menu {
        width: 40px;
        height: 60px;

        margin: none;

        border: none;
        background: transparent;

        cursor: pointer;

        display: none;
      }

      .header-btn-pack-menu img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      /* HEADER MOBILE BAR */

      .header-mobile-menutop {
        display: none;
      }

      .header-mobile {
        position: flex;
        top: 0;
        left: 0;

        width: 100%;
        height: 6vh;
        /*
    background: rgba(255, 255, 255, 0.85);
*/
        display: flex;
        align-items: center;
        justify-content: space-around;


        padding: 0 24px;
        margin-top: -5vh;

        z-index: 10;

        /*
    backdrop-filter: blur(8px);
*/
      }


      /* BUTTONS MOBILE menu?*/
      .header-btn-mobile {
        width: 48px;
        height: 48px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-mobile:hover {
        transform: scale(1.1);
      }

      .header-btn-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-2-mobile {
        width: 48px;
        height: 48px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-2-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-3-mobile {
        width: 48px;
        height: 48px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-3-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }



      .header-btn-4-mobile {
        width: 48px;
        height: 48px;

        border: none;
        background: transparent;

        cursor: pointer;

        transition: transform 0.2s ease;
      }

      .header-btn-4-mobile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>


  <!-- HEADER -->
  <header class="header">

    <!-- BACK BUTTON -->
    <button class="header-btn" id="backBtn">
      <img src="images/arrow_icon.png" alt="Back" style="rotate: 90deg;">
    </button>


    <h2 class="h2-left">TURNER
    </h2>


    <button class="header-btn-pack" id="packBtn2">
      <img src="images/pack_2.png" alt="Pack 2">
    </button>


    <button class="header-btn-pack-menu" id="packBtnmenu">
      <img src="images/menu_icon.png" alt="Menu Btn">
    </button>


    <h2 class="h2-right">
      ASHTON
    </h2>


    <!-- HOME BUTTON -->
    <button class="header-btn" id="homeBtn">
      <img src="images/home_icon.png" alt="Home">
    </button>

  </header>

  <div class="cards-container">

    <!-- CARD 1 -->
    <div class="card card-1" data-link="pack_2_card_1.html">
      <div class="card-face card-back">
        <img src="images/card_2_back.png" alt="">
      </div>

      <div class="card-face card-front">
        <img src="images/pack_2_card_1.png" alt="">
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="card card-2" data-link="pack_2_card_2.html">
      <div class="card-face card-back">
        <img src="images/card_2_back.png" alt="">
      </div>

      <div class="card-face card-front">
        <img src="images/pack_2_card_2.png" alt="">
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="card card-3" data-link="pack_2_card_3.html">
      <div class="card-face card-back">
        <img src="images/card_2_back.png" alt="">
      </div>

      <div class="card-face card-front">
        <img src="images/pack_2_card_3.png" alt="">
      </div>
    </div>

  </div>

  <script>
    const cards = document.querySelectorAll('.card');

    // Step 1: Spread cards after load
    window.addEventListener('load', () => {
      setTimeout(() => {
        cards.forEach(card => {
          card.classList.add('spread');
        });
      }, 500);
    });

    // Step 2 + 3:
    // First click = flip
    // Second click = navigate
    cards.forEach(card => {

      let flipped = false;

      card.addEventListener('click', () => {

        // FIRST CLICK
        if (!flipped) {
          flipped = true;
          card.classList.add('flipped');
        }

        // SECOND CLICK
        else {
          const link = card.dataset.link;
          window.location.href = link;
        }

      });

    });




    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTONS
    document.getElementById('packBtn1').addEventListener('click', () => {
      window.location.href = 'pack1.html';
    });
    document.getElementById('packBtn2').addEventListener('click', () => {
      window.location.href = 'pack2.html';
    });
    document.getElementById('packBtn3').addEventListener('click', () => {
      window.location.href = 'pack3.html';
    });
    document.getElementById('packBtn4').addEventListener('click', () => {
      window.location.href = 'pack4.html';
    });
    document.getElementById('packBtn5').addEventListener('click', () => {
      window.location.href = 'pack5.html';
    });

    document.getElementById('packBtnmenu').addEventListener('click', () => {
      window.location.href = 'menu.html';
    });
  </script>

</body>

</html>
