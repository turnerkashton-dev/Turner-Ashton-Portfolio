  <script>

    const images = [
    document.querySelector('#journey-img'),
    document.querySelector('#journey-img2'),
    document.querySelector('#journey-img3'),
    document.querySelector('#journey-img4'),
    document.querySelector('#journey-img5'),

];


const desktopImages = [
    'images/journey1_mountains2.png',
    'images/journey_lego2.png',
    'images/journey_travel2.png',
    'images/journey_soccer2.png',
    'images/journey_home2.png',
    'images/journey_turner2.png'
];

const mobileImages = [
    'images/journey1_mountainsmobile.png',
    'images/journey_legomobile.png',
    'images/journey_travelmobile.png',
    'images/journey_soccermobile.png',
    'images/journey_homemobile.png',
    'images/journey_turnermobile.png'
];

function updateJourneyImages() {
    const isMobile = window.innerWidth <= 700;

    images.forEach((img, index) => {
        img.src = isMobile
            ? mobileImages[index]
            : desktopImages[index];
    });
}



window.addEventListener('resize', () => {
    updateJourneyImages();
    updateJourney();
    updateScrollProgress();
});






    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTON
    document.getElementById('packBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });



const track = document.querySelector('.journey-scroll-track');



const desktopImageSpacing = 1;
const mobileImageSpacing = 0.7;

const desktopStageCount = 5;
const mobileStageCount = 3.4;

function getImageSpacing() {
    return window.innerWidth <= 700
        ? mobileImageSpacing
        : desktopImageSpacing;
}

function updateJourney() {
    const scrollableDistance = track.offsetHeight - window.innerHeight;

    if (scrollableDistance <= 0) return;

    const rect = track.getBoundingClientRect();

    const progress = Math.max(
        0,
        Math.min(1, -rect.top / scrollableDistance)
    );

const isMobile = window.innerWidth <= 700;

const imageSpacing = isMobile
    ? mobileImageSpacing
    : desktopImageSpacing;

const stageCount = isMobile
    ? mobileStageCount
    : desktopStageCount;

const stage = progress * stageCount;

    images.forEach((img, index) => {
const position = (index * getImageSpacing() - stage) * 100;

        img.style.transform = `translate3d(0, ${position}vh, 0)`;
    });
}

// journey top of page on load -t here for edit
if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}

window.addEventListener('pageshow', () => {
    window.scrollTo(0, 0);
    updateJourney();
});

function initializeJourney() {
    window.scrollTo(0, 0);
    updateJourney();

    requestAnimationFrame(() => {
        document.documentElement.classList.add('journey-initialized');
    });
}

window.addEventListener('scroll', updateJourney, { passive: true });
window.addEventListener('resize', updateJourney);

initializeJourney();







// MOBILE HEADER SCROLL PROGRESS

const scrollingButtons = document.getElementById('scrollingButtons');
const scrollProgressBar = document.getElementById('scrollProgressBar');

function updateScrollProgress() {

    const maxScroll =
        scrollingButtons.scrollWidth - scrollingButtons.clientWidth;

    const progress = maxScroll > 0
        ? (scrollingButtons.scrollLeft / maxScroll) * 100
        : 0;

    scrollProgressBar.style.width = progress + '%';
}

scrollingButtons.addEventListener('scroll', updateScrollProgress);

window.addEventListener('resize', updateScrollProgress);

updateScrollProgress();


  </script>
