  <script>

    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTON
    document.getElementById('packBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });



const track = document.querySelector('.journey-scroll-track');

const images = [
    document.querySelector('#journey-img'),
    document.querySelector('#journey-img2'),
    document.querySelector('#journey-img3'),
    document.querySelector('#journey-img4'),
    document.querySelector('#journey-img5'),
    document.querySelector('#journey-img6')
];

const imageSpacing = 1;
const stageCount = 6;

function updateJourney() {
    const scrollableDistance = track.offsetHeight - window.innerHeight;

    if (scrollableDistance <= 0) return;

    const rect = track.getBoundingClientRect();

    const progress = Math.max(
        0,
        Math.min(1, -rect.top / scrollableDistance)
    );

    const stage = progress * stageCount;

    images.forEach((img, index) => {
        const position = (index * imageSpacing - stage) * 120;

        img.style.transform = `translate3d(0, ${position}vh, 0)`;
    });
}

// journey top of page on load -t here for edit
if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}

window.addEventListener('pageshow', () => {
    window.scrollTo(0, 0);
    updateJourney();
});

function initializeJourney() {
    window.scrollTo(0, 0);
    updateJourney();

    requestAnimationFrame(() => {
        document.documentElement.classList.add('journey-initialized');
    });
}

window.addEventListener('scroll', updateJourney, { passive: true });
window.addEventListener('resize', updateJourney);

initializeJourney();




  </script>

  /* SCROLL-DRIVEN JOURNEY */

html {

}

.journey-scroll-track {
    position: relative;
    height: 700vh;
    width: 100%;
}

.journey-stage {
    position: sticky;
    top: 100vh;
    height: 100vh;
    width: 100vw;
    overflow: visible;
}

.journey-image1,
.journey-image2,
.journey-image3,
.journey-image4,
.journey-image5,
.journey-image6 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    transform: none;

}

.journey-stage img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 100%;
    object-fit: contain;
    will-change: transform, opacity;
    transition: opacity 0.15s linear;
}

#journey-img {
    width: 100%;
    max-height: none;
