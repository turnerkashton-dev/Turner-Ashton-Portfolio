  <script>

    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTON
    document.getElementById('packBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });



// journey
const forwardButton = document.getElementById('journey-forward-btn');
const backButton = document.getElementById('journey-back-btn');
const homeButton = document.getElementById('journey-home-btn');

const journey1 = document.querySelector('.journey-image1');
const journey2 = document.querySelector('.journey-image2');
const journey3 = document.querySelector('.journey-image3');
const journey4 = document.querySelector('.journey-image4');
const journey5 = document.querySelector('.journey-image5');
const journey6 = document.querySelector('.journey-image6');

let journeyStep = 1;

// FORWARD
forwardButton.addEventListener('click', () => {

    if (journeyStep === 1) {

        // FIRST CLICK:
        // Move Journey 1 upward
        journey1.classList.add('move-up');
        journeyStep = 1.5;

    } else if (journeyStep === 1.5) {

        // SECOND CLICK:
        // Move Journey 1 farther upward
        journey1.classList.add('move-up-2');
        journeyStep = 1.75;

    } else if (journeyStep === 1.75) {

        // THIRD CLICK:
        // Journey 1 → Journey 2
        journey1.classList.add('move-down');
        journey2.classList.add('move-in');
        journeyStep = 2;

    } else if (journeyStep === 2) {

        // Journey 2 → Journey 3
        journey2.classList.add('move-down');
        journey3.classList.add('move-in');
        journeyStep = 3;

    } else if (journeyStep === 3) {

        // Journey 3 → Journey 4
        journey3.classList.add('move-down');
        journey4.classList.add('move-in');
        journeyStep = 4;

    } else if (journeyStep === 4) {

        // Journey 4 → Journey 5
        journey4.classList.add('move-down');
        journey5.classList.add('move-in');
        journeyStep = 5;

    } else if (journeyStep === 5) {

        // Journey 5 → Journey 6
        journey5.classList.add('move-down');
        journey6.classList.add('move-in');
        journeyStep = 6;
    }
});


// BACK
backButton.addEventListener('click', () => {

    if (journeyStep === 1.75) {

        // Journey 1: second position → first position
        journey1.classList.remove('move-up-2');
        journeyStep = 1.5;

    } else if (journeyStep === 1.5) {

        // Journey 1: first position → starting position
        journey1.classList.remove('move-up');
        journeyStep = 1;

    } else if (journeyStep === 2) {

        // Journey 2 → Journey 1
        journey1.classList.remove('move-down');
        journey2.classList.remove('move-in');

        journeyStep = 1.75;

    } else if (journeyStep === 3) {

        // Journey 3 → Journey 2
        journey2.classList.remove('move-down');
        journey3.classList.remove('move-in');

        journeyStep = 2;

    } else if (journeyStep === 4) {

        // Journey 4 → Journey 3
        journey3.classList.remove('move-down');
        journey4.classList.remove('move-in');

        journeyStep = 3;

    } else if (journeyStep === 5) {

        // Journey 5 → Journey 4
        journey4.classList.remove('move-down');
        journey5.classList.remove('move-in');

        journeyStep = 4;

    } else if (journeyStep === 6) {

        // Journey 6 → Journey 5
        journey5.classList.remove('move-down');
        journey6.classList.remove('move-in');

        journeyStep = 5;
    }
});


// JOURNEY HOME — RETURN TO START OF IMAGE 1
homeButton.addEventListener('click', () => {

    journey1.classList.remove('move-up');
    journey1.classList.remove('move-up-2');
    journey1.classList.remove('move-down');

    journey2.classList.remove('move-in');
    journey2.classList.remove('move-down');

    journey3.classList.remove('move-in');
    journey3.classList.remove('move-down');

    journey4.classList.remove('move-in');
    journey4.classList.remove('move-down');

    journey5.classList.remove('move-in');
    journey5.classList.remove('move-down');

    journey6.classList.remove('move-in');
    journey6.classList.remove('move-down');

    journeyStep = 1;
});






  </script>
