<script type="module">
    import { initializeApp, getApps } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import { getAuth, onAuthStateChanged } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        arrayUnion
    } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB4srPzYoTzploFgfsnSt7rg6sKKAVK6xo",
        authDomain: "portfolio-signin-html.firebaseapp.com",
        projectId: "portfolio-signin-html",
        storageBucket: "portfolio-signin-html.firebasestorage.app",
        messagingSenderId: "435126326109",
        appId: "1:435126326109:web:9dee9abbc93c3c104b4eb4",
        measurementId: "G-7YK2HQL61F"
    };

    const app = getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);

    // Automatically identifies the current card page.
    const cardId = window.location.pathname.split("/").pop();

    onAuthStateChanged(auth, async (user) => {
        // Do not save discoveries for signed-out visitors.
        if (!user) return;

        try {
            const userRef = doc(db, "users", user.uid);

            await setDoc(userRef, {
                viewedCards: arrayUnion(cardId)
            }, { merge: true });

            console.log("Card saved to folder:", cardId);
        } catch (error) {
            console.error("Could not save card discovery:", error);
        }
    });

.special-card-container {
    width: 45vw;
    perspective: 1000px;
    margin-left: auto;

}

.special-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;

    transform-style: preserve-3d;
    animation: rotateCard 5s ease-in-out 1s infinite alternate;
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.card-front img,
.card-back img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
}

.card-back {
    transform: rotateY(180deg);
}

@keyframes rotateCard {
    from {
        transform: translateY(0px) rotateY(0deg) scale(1);
    }

    to {
        transform: translateY(-50px) rotateY(720deg) scale(1.5);
    }
}
