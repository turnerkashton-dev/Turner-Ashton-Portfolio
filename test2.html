<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!--PACK 1 hover & click-->
<div class="container-pack-1">

  <div class="hover-text">
    PACK 1
  </div>

  <div class="png-wrapper">
    <a href="pack1intro.html">
      <img src="images/pack_1.png" class="floating-png" alt="PNG">

  </div>

</div>

<style>
.container-pack-1 {
  position: relative;
}

body {
    background-color: black;
}

/* FULLSCREEN TEXT */
.hover-text {
  position: fixed;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  font-size: 8rem;
  font-weight: bold;

  color: white;

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.4s ease;

  z-index: 999;

  letter-spacing: 10px;
}

/* SHOW ON HOVER */
.container-pack-1:hover .hover-text {
  opacity: 0.5;
}

</style>
