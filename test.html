<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hover Fade Text</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .container {
    width: 300px;
    height: 200px;
    background: #444;
    cursor: pointer;
    position: relative;
  }

  /* Fullscreen centered text */
  .hover-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    font-size: 5rem;
    font-weight: bold;
    color: white;

    opacity: 0;
    pointer-events: none;

    transition: opacity 0.5s ease;
  }

  /* Fade in on hover for text behind*/
  .container:hover ~ .hover-text {
    opacity: 0.5;
  }
</style>
</head>

<body>

<div class="container"></div>

<div class="hover-text">
  HELLO
</div>

</body>
</html>
