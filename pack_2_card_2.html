    <script>function initComparisonSlider(container) {
        const before = container.querySelector('.before');
        const handle = container.querySelector('.comparison-handle');
        let isDragging = false;

        // Calculate position as percentage
        function getPercent(clientX) {
          const rect = container.getBoundingClientRect();
          const x = clientX - rect.left;
          return Math.max(0, Math.min(100, (x / rect.width) * 100));
        }

        // Update the slider
        function updateSlider(percent) {
          before.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
          handle.style.left = percent + '%';
        }

        // Mouse events
        container.addEventListener('mousedown', (e) => {
          isDragging = true;
          updateSlider(getPercent(e.clientX));
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          updateSlider(getPercent(e.clientX));
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
      }

      // Initialisation
      initComparisonSlider(document.querySelector('.comparison-slider'));</script>

      border-right: 50px solid;
      border-bottom: 20px solid;


      border-color: rgba(255, 255, 255, 0.342);

      backdrop-filter: blur(8px);
    }


    .comparison-slider {
      margin-left: 16vw;

      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 12;
      overflow: hidden;
      border-radius: 12px;
      cursor: ew-resize;
      user-select: none;
    }

    .comparison-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .comparison-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comparison-layer.after {
      z-index: 1;
    }

    .comparison-layer.before {
      z-index: 2;
      /* clip-path: inset(top right bottom left) */
      /* Shows 50% left of the BEFORE image */
      clip-path: inset(0 50% 0 0);
    }

    .comparison-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: white;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    /* Handle circle */
    .comparison-handle::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    /* Icone fleches */
    .comparison-handle::after {
      content: '↔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #333;
    }

    .p-reveal-instructions {
