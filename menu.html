<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #111;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }

  /* HEADER BAR */
  .header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    background: rgba(255, 255, 255, 0.85);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    z-index: 1000;

    border-bottom: 1px solid rgba(255, 255, 255, 0.1);

    backdrop-filter: blur(8px);
  }

  /* BUTTONS */
  .header-btn {
    width: 48px;
    height: 48px;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: transform 0.2s ease;
  }

  .header-btn:hover {
    transform: scale(1.1);
  }

  .header-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* PAGE CONTENT */
  .content {
    padding-top: 120px;
    color: white;
    text-align: center;
  }






  table,
  th,
  td {
    width: 100vw;
    border-spacing: 10px;
    border: double 1px rgba(255, 0, 0, 0);
    background-color: rgba(255, 255, 255, 0.164);
    mix-blend-mode: screen;
    -webkit-text-fill-color: black;
    padding: 8px;
    padding-left: 5%;
    padding-right: 5%;
    backdrop-filter: blur(4px);
  }

  td {
    text-align: center;
    border-radius: 25px;

  }

  td:hover {
    background-color: black;
    -webkit-text-fill-color: white;
    mix-blend-mode: luminosity;
    backdrop-filter: blur(1px);
    -webkit-backgdrop-filter: blur(5px) saturate(1.2);
    filter: blur(0px) contrast(100);
    opacity: 80%;
  }

  th {
    mix-blend-mode: normal;
    background-color: rgba(255, 0, 0, 0.363);
  }


  ol {
    margin-top: 0px;
    background-color: white;
    list-style: disc;
    padding-left: 40%;
  }

  li {
    text-align: left;
    -webkit-text-fill-color: #000000;
  }

  caption {
    background-color: white;
    -webkit-text-fill-color: rgb(255, 0, 0);
    font-size: larger;
    font-weight: 600;
  }


  form {
    padding: 30px 25px;

    background: #d7d6d6;
    opacity: 98%;
    mix-blend-mode: luminosity;
    padding-left: 20%;
    padding-right: 20%;

  }
</style>
