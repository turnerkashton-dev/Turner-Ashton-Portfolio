<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #5f5a5a;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background-image: url('images/background_grid_2.jpeg');
    background-size: cover;

    background-blend-mode: multiply;
  }

  /* HEADER BAR */
  .header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    background: rgba(255, 255, 255, 0.85);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    z-index: 1000;

    border-bottom: 1px solid rgba(255, 255, 255, 0.1);

    backdrop-filter: blur(8px);
  }

  /* BUTTONS */
  .header-btn {
    width: 48px;
    height: 48px;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: transform 0.2s ease;
  }

  .header-btn:hover {
    transform: scale(1.1);
  }

  .header-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;

  }

  /* PAGE CONTENT */
  .content {
    padding-top: 120px;
    color: white;
    text-align: center;
  }



  .header-btn-pack {
    width: 48px;
    height: 48px;

    margin: none;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: scale(1.1);

  }

  .header-btn-pack:hover {
    transform: scale(1.1);
  }

  .header-btn-pack img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
