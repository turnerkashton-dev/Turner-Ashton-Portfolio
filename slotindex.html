<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slots WIP</title>
    <link rel="stylesheet" href="./slots.css">
    <script src="./slots.js" defer></script>
    <script type="module" src="./slot-progress.js"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}


/*
 * BREATHING BACKGROUND
 */

#bg {
    position: fixed;

    top: -5%;
    left: -5%;

    width: 110vw;
    height: 110vh;

    background-image: url(images/background_grid_room.jpeg);
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;

    z-index: -10;

    pointer-events: none;

    animation: breathe 16s ease-in-out infinite;
}


@keyframes breathe {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}


/*
 * MOBILE BACKGROUND
 */

@media screen and (max-width: 700px) {

    #bg {
        background-image:
            url(images/background_grid_room.jpeg);

        width: 110vw;
        height: 110vh;

        top: -5%;
        left: -5%;
    }
}

</style>

</head>


<body>


    <!-- HOME BUTTON -->
    <button class="slots-home" id="homeBtn">
      <img src="images/home_iconV.2_white.png" alt="Home">
    </button>

          <!-- PROFILE BUTTON -->
      <a href="dashboard.html">
        <div class="profile-container">
          <button class="profile-btn" id="aboutMeBtn">
            <img src="images/binder.png" alt="Profile Image" class="profile-image">
          </button>
        </div>
      </a>

  <header class="slots-header">
<p>ターナー</p>
</header>

  <div class="mobile-vignette"></div>

  

<div class="sprite-container">
    <img id="slotSprite" src="images/sprite_0.png" alt="Sprite">
</div>

<div id="introText">
    Welcome to the slot machine!
</div>

<p id="continueText">Click anywhere to continue</p>


<div id="multiplierPanel">
      <div id="multiplierControls"></div>
    <h3>UNLOCKED MULTIPLIERS (ON = Symbol is 3x more likely to appear)</h3>
</div>


  <div id="container">
    <div class="window-border">
      <div class="window">
        <div class="outer-spacer"></div>
        <div class="outer-col">
          <div class="col"></div>
        </div>

        <div class="outer-spacer"></div>
        <div class="outer-col">
          <div class="col"></div>
        </div>

        <div class="outer-spacer"></div>
        <div class="outer-col">
          <div class="col"></div>
        </div>

        <div class="outer-spacer"></div>
        <div class="outer-col">
          <div class="col"></div>
        </div>

        <div class="outer-spacer"></div>
        <div class="outer-col">
          <div class="col"></div>
        </div>
        <div class="outer-spacer"></div>
      </div>
    </div>




<div class="spin-button-backing">

    <!-- From Uiverse.io by cssbuttons-io --> 
    <button class="start-button" onclick="spin(this)" value="Spin">
  <span class="shadow"></span>
  <span class="edge"></span>
  <span class="front text"> &#10026; SPIN &#10026;
  </span>
    </button>

</div>


<!-- UNLOCKED PAGES -->
<section id="unlockedSection">
    <h2>YOUR COLLECTION</h2>
    <p id="collectionMessage">Your won pages will appear here.</p>
    <div id="unlockedPages"></div>
</section>


  </div>



    <script>
    
    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

</script>





<div id="bg"></div>



</body>

</html>
