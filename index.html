<!-- CLICKABLE PNG -->
<img
  src="images/pack_random.png"
  class="floating-png"
  id="random-image"
  alt="PNG"
>

<!-- HIDDEN VIDEO PLAYER -->
<video id="loader-video" autoplay playsinline>
  <source
    src="videos/random_pack_video_loader2.mp4"
    type="video/mp4"
  >
</video>

<script>
  const pages = [
    "pack1.html",
    "pack2.html",
    "pack3.html",
    "pack4.html",
    "pack5.html",
  ];

  const image = document.getElementById("random-image");
  const video = document.getElementById("loader-video");

  image.addEventListener("click", () => {

    // Pick random page
    const randomPage =
      pages[Math.floor(Math.random() * pages.length)];

    // Show video across browser window
    video.style.display = "block";

    // Play video
    video.play();

    // Redirect after video ends
    video.onended = () => {
      window.location.href = randomPage;
    };
  });
</script>

<!--include /body here if needed -tka -->

<style>
  .floating-png {
    width: 250px;
    cursor: pointer;
    transition: transform 0.5s ease;
  }

  .floating-png:hover {
    transform: translateY(-40px);
  }

  /* Full browser video */
  #loader-video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: black;
    display: none;
    z-index: 9999;
  }
</style>
