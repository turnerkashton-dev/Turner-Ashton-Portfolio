<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro Video Pack 1</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <video id="intro-video" autoplay muted playsinline>
    <source src="videos/random_video_short.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("intro-video");

    video.onended = () => {
      window.location.href = "pack4.html";
    };
  </script>

</body>
</html>
