<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pack 5 Card 2</title>


</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- BACK BUTTON -->
    <button class="header-btn" id="backBtn">
      <img src="images/arrow_icon.png" alt="Back" style="rotate: 90deg;">
    </button>



    <h2 class="h2-left">TURNER
    </h2>


    <button class="header-btn-pack" id="packBtn">
      <img src="images/pack_5.png" alt="Pack 5">
    </button>

    <button class="header-btn-pack" id="backBtn">
      <img src="images/pack_5_card_2.png" alt="card 2 pack 5">
    </button>


    <h2 class="h2-right">
      ASHTON
    </h2>

    <!-- HOME BUTTON -->
    <button class="header-btn" id="homeBtn">
      <img src="images/home_icon.png" alt="Home">
    </button>

  </header>

  <!-- PAGE CONTENT -->
  <div class="content">
    <h1>
      <&emsp;Animated Wallpaper Pair for Desktop Monitors&emsp;> </A>
    </h1>

    <br>

    <video class="showcase-video" controls muted>
      <source src="videos/csm_illustrator_timelapse.mp4" type="video/mp4">
    </video>




    <br>

    <video autoplay loop class="video-tka1">
      <source src="videos/csm_wallpaper_secondary.mp4" type="video/mp4">
    </video>

    <video autoplay loop class="video-tka1">
      <source src="videos/csm_wallpaper_main.mp4" type="video/mp4">
    </video>


    <!--
<iframe src="pdfs/tsukii pt2 STYLE GUIDE FINAL PDF.pdf" width="70%" height="1000px" style="border: none;">
    <p>Your browser does not support iframes. <a href="pdfs/tsukii pt2 STYLE GUIDE FINAL PDF.pdf">Download the PDF instead.</a></p>
</iframe>
-->
  </div>

  <script>

    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTON
    document.getElementById('packBtn').addEventListener('click', () => {
      window.location.href = 'pack5.html';
    });
  </script>

</body>

</html>



<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #5f5a5a;
    min-height: 100vh;
    font-family: Arial, sans-serif;


    background-image: url('images/background_grid_2.jpeg');
    background-size: cover;


    background-blend-mode: multiply;
  }


  /* HEADER BAR */
  .header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    background: rgba(255, 255, 255, 0.85);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    z-index: 1000;

    border-bottom: 1px solid rgba(255, 255, 255, 0.1);

    backdrop-filter: blur(8px);
  }

  /* BUTTONS */
  .header-btn {
    width: 48px;
    height: 48px;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: transform 0.2s ease;
  }

  .header-btn:hover {
    transform: scale(1.1);
  }

  .header-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* PAGE CONTENT */
  .content {
    padding-top: 120px;
    color: white;
    text-align: center;
  }



  .header-btn-pack {
    width: 48px;
    height: 48px;

    margin: none;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: scale(1.1);

  }

  .header-btn-pack:hover {
    transform: scale(1.1);
  }

  .header-btn-pack img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }




  /*DESKTOP CSS FROM HERE ON*/
  /* =========================*/
  @media (min-width: 1410px) {



    .responsive-tka1 {
      width: 10%;
      height: auto;
    }

    .responsive-tka2 {
      width: 10%;
      height: auto;
      margin-bottom: 25%;
    }

    h1 {
      font-size: 2vw;
      color: rgb(255, 255, 255);

    }

    .h2-right {
      margin-right: 40%;
    }

    .h2-left {
      margin-left: 40%
    }


    .responsive-tka3 {
      width: 30%;
      height: auto;
    }

    .video-tka1 {
      width: 20%;
      height: auto;
    }

    .showcase-video {
      width: 50%;
      height: auto;

      border: 30px rgba(255, 255, 255, 0.253) solid;
      border-radius: 20px;

    }

  }



  /*MOBILE CSS FROM HERE ON*/
  /* =========================*/

  @media (max-width: 1410px) {

    body {
      background-size: contain;
    }



    .responsive-tka1 {
      width: 40%;
      height: auto;
    }

    .responsive-tka2 {
      width: 40%;
      height: auto;
    }


    h1 {
      font-size: 5vw;
    }

    h2 {
      font-size: 5vw;
    }

    .responsive-tka3 {
      width: 80%;
      height: auto;
    }


    .video-tka1 {
      width: 45%;
      height: auto;
    }


    .showcase-video {
      width: 90%;
      height: auto;

      border: 30px rgba(255, 255, 255, 0.253) solid;
      border-radius: 20px;
    }

  }
</style>
