<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pack 2 Card 1</title>


</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- BACK BUTTON -->
    <button class="header-btn" id="backBtn">
      <img src="images/arrow_icon.png" alt="Back" style="rotate: 90deg;">
    </button>



    <h2 class="h2-left">TURNER
    </h2>


    <button class="header-btn-pack" id="packBtn">
      <img src="images/pack_2.png" alt="Pack 2">
    </button>

    <button class="header-btn-pack" id="backBtn">
      <img src="images/pack_2_card_1.png" alt="card 1 pack 2">
    </button>


    <h2 class="h2-right">
      ASHTON
    </h2>


    <!-- HOME BUTTON -->
    <button class="header-btn" id="homeBtn">
      <img src="images/home_icon.png" alt="Home">
    </button>

  </header>

  <!-- PAGE CONTENT -->
  <div class="content">
    <h1>
      <&emsp;Tsukii Printing Mockups&emsp;> </A>
    </h1>

    <br>
    <h2>ENVELOPE MOCKUP EXAMPLE</h2>
    <img src="images/tsukii_printing_envelope.jpg" alt="Tsukii printing envelope" class="responsive-tka2">


    <img src="images/tsukii_printing_letterhead.jpg" alt="Tsukii printing letterhead" class="responsive-tka2">


    <img src="images/tsukii_printing_business_card.jpg" alt="Tsukii business card" class="responsive-tka2">

    <br>

    <h2>temporary filler</h2>

    <br>
    <br>
    <br>


    <img src="images/tsukii_all_printing_examples.jpg" alt="Tsukii all printing examples" class="responsive-tka1">




    <br>





  </div>

  <script>

    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // PACK BUTTON
    document.getElementById('packBtn').addEventListener('click', () => {
      window.location.href = 'pack2.html';
    });
  </script>

</body>

</html>



<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #5f5a5a;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background-image: url('images/background_grid_2.jpeg');
    background-size: cover;

    background-blend-mode: multiply;
  }

  /* HEADER BAR */
  .header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    background: rgba(255, 255, 255, 0.85);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    z-index: 1000;

    border-bottom: 1px solid rgba(255, 255, 255, 0.1);

    backdrop-filter: blur(8px);
  }

  /* BUTTONS */
  .header-btn {
    width: 48px;
    height: 48px;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: transform 0.2s ease;
  }

  .header-btn:hover {
    transform: scale(1.1);
  }

  .header-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;

  }

  /* PAGE CONTENT */
  .content {
    padding-top: 120px;
    color: white;
    text-align: center;
  }



  .header-btn-pack {
    width: 48px;
    height: 48px;

    margin: none;

    border: none;
    background: transparent;

    cursor: pointer;

    transition: scale(1.1);

  }

  .header-btn-pack:hover {
    transform: scale(1.1);
  }

  .header-btn-pack img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


  /*DESKTOP CSS FROM HERE ON*/
  /* =========================*/
  @media (min-width: 1410px) {

    .responsive-tka1 {
      max-width: 60%;
      height: auto;
      border-radius: 50px;
    }

    .responsive-tka2 {
      max-width: 30%;
      height: auto;
      border-radius: 50px;

    }




    h1 {
      font-size: 2vw;
    }

    .h2-right {
      margin-right: 40%;
    }

    .h2-left {
      margin-left: 40%
    }

  }



  /*MOBILE CSS FROM HERE ON*/
  /* =========================*/

  @media (max-width: 1410px) {

    body {
      background-size: contain;
    }

    .responsive-tka1 {
      max-width: 80%;
      height: auto;

      border-radius: 25px;
    }

    .responsive-tka2 {
      max-width: 80%;
      height: auto;
      border-radius: 50px;

      border-radius: 15px;
    }


    h1 {
      font-size: 5vw;
    }

  }
</style>
