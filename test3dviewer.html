<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d test</title>
</head>
<body>

<!-- Use it like any other HTML element -->
    <model-viewer
    src="3ds/pack1.glb"
    alt="blank card package"
    shadow-intensity="1"
    camera-controls
    camera-controls touch-action="pan-y" camera-orbit="-45deg 35deg 4m" src="../../shared-assets/models/Astronaut.glb" alt="A 3D model of pack1"
     >
    </model-viewer>

<!-- Import the component script via link -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</body>



<style>

body {
  justify-content: center;
  align-items: center;
  background-image: url(images/background_grid_2.jpeg);
  background-blend-mode: soft-light;
}






   model-viewer {
       width: 90vw;
       height: 50vh;
      background-color: rgba(0, 0, 0, 0.74);
       border: rgb(255, 255, 255);
       border-width: 15px;
       border-style: solid;
       margin-left: 10vh;
       margin-right: 10vh;
       margin-top: 10vh;
                      -webkit-box-reflect: below 10px linear-gradient(to bottom, rgba(0,0,0,0.0), rgba(0,0,0,0.4));

   }




   
</style>

</html>
