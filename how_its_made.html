    // BACK BUTTON
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    // HOME BUTTON
    document.getElementById('homeBtn').addEventListener('click', () => {

    //journey
// JOURNEY BUTTONS
const nextButton = document.getElementById('journey1-btn');
const backButton = document.getElementById('journey-back-btn');
const startButton = document.getElementById('journey-start-btn');

const track = document.getElementById('journeyTrack');

const totalJourneys = 6;
let currentJourney = 0;


// NEXT
nextButton.addEventListener('click', () => {

    if (currentJourney < totalJourneys - 1) {
        currentJourney++;

        track.style.transform =
            `translateY(-${currentJourney * 100}vh)`;
    }

});


// BACK ONE IMAGE
backButton.addEventListener('click', () => {

    if (currentJourney > 0) {
        currentJourney--;

        track.style.transform =
            `translateY(-${currentJourney * 100}vh)`;
    }

});


// GO TO BEGINNING
startButton.addEventListener('click', () => {

    currentJourney = 0;

    track.style.transform =
        'translateY(0)';

});




// MOBILE HEADER SCROLL PROGRESS

const scrollingButtons = document.getElementById('scrollingButtons');
const scrollProgressBar = document.getElementById('scrollProgressBar');

function updateScrollProgress() {

    const maxScroll =
        scrollingButtons.scrollWidth - scrollingButtons.clientWidth;

    const progress = maxScroll > 0
        ? (scrollingButtons.scrollLeft / maxScroll) * 100
        : 0;

    scrollProgressBar.style.width = progress + '%';
}

scrollingButtons.addEventListener('scroll', updateScrollProgress);
window.addEventListener('resize', updateScrollProgress);

updateScrollProgress();


  </script>
